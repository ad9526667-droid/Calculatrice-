<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ALI NEON OFFLINE VOSK</title>
<link rel="manifest" id="manifest-link">
<meta name="theme-color" content="#00ff88">
<script src="https://cdn.jsdelivr.net/npm/vosk-browser@0.0.8/dist/vosk.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap');
*{box-sizing:border-box} html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:#050508;display:flex;justify-content:center;align-items:center;font-family:'Orbitron',monospace;}
.calc{width:100%;max-width:380px;height:100dvh;max-height:800px;background:rgba(15,15,25,0.95);border:1px solid #00ff88;border-radius:24px;padding:12px;display:flex;flex-direction:column;box-shadow:0 0 20px #00ff88,0 0 60px #00ff88 inset;}
h2{color:#fff;text-align:center;font-size:8px;letter-spacing:2px;opacity:0.6;margin:2px 0 4px 0;}
#status{color:#00ff88;font-size:8px;text-align:center;height:12px;}
#history{color:#00ff8844;font-size:11px;text-align:right;height:14px;overflow:hidden;white-space:nowrap;}
#screen{background:#000;color:#00ff88;font-size:26px;text-align:right;padding:12px;border-radius:12px;border:1px solid #00ff8833;min-height:50px;text-shadow:0 0 12px #00ff88;overflow:hidden;}
.topbar{display:flex;gap:8px;margin:8px 0;}.topbar button{flex:1;padding:11px;font-size:10px;border-radius:20px;border:none;font-weight:700;}
.grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.grid button{width:100%;height:100%;padding:0;font-size:13px;border-radius:12px;background:#1e1e32;color:#fff;border:1px solid #ffffff10;cursor:pointer;}
.op{color:#00ff88!important;}.sci{color:#ff44ff!important;font-size:11px!important;}
.equal{background:#00ff88!important;color:#000!important;box-shadow:0 0 18px #00ff88;font-size:22px!important;font-weight:900;}
.clear{background:#ff2a5a!important;}.mic{background:#111!important;border:1px solid #00ff88!important;color:#00ff88!important;}
.mic.listening{background:#00ff88!important;color:#000!important;animation:pulseMic 0.8s infinite;}
@keyframes pulseMic{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
.xy{background:#ff00cc!important;color:#000!important;}
</style>
</head>
<body>
<div class="calc">
<h2>ALI • OFFLINE TOTAL • VOSK</h2>
<div id="status">Moteur: initialisation...</div>
<div id="history"></div>
<div id="screen">0</div>
<div class="topbar">
<button class="clear" onclick="clearAll()">AC Retour</button>
<button id="micBtn" class="mic" onclick="startMicOffline()">🎤 Offline</button>
</div>
<div class="grid">
<button class="sci" onclick="add('%')">%</button>
<button class="sci" onclick="add('(')">(</button>
<button class="sci" onclick="add(')')">)</button>
<button class="op" onclick="add('÷')">÷</button>
<button class="sci" onclick="add('√')">√</button>
<button class="sci" onclick="add('²')">x²</button>
<button class="sci" onclick="add('³')">x³</button>
<button class="op" onclick="add('×')">×</button>
<button class="sci" onclick="add('sin(')">sin</button>
<button class="sci" onclick="add('cos(')">cos</button>
<button class="sci" onclick="add('tan(')">tan</button>
<button class="op" onclick="add('-')">-</button>
<button class="sci" onclick="add('log(')">log</button>
<button class="sci" onclick="add('ln(')">ln</button>
<button class="sci" onclick="add('!')">x!</button>
<button class="op" onclick="add('+')">+</button>
<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button class="sci" onclick="add('π')">π</button>
<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button class="sci" onclick="add('e')">e</button>
<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button class="xy" onclick="add('^')">xʸ</button>
<button onclick="add('0')">0</button>
<button onclick="add('.')">.</button>
<button class="sci" onclick="back()">⌫</button>
<button class="equal" onclick="calc()">=</button>
</div>
</div>

<script>
// PWA AUTO
const manifestData={name:"ALI NEON OFFLINE",short_name:"ALI OFF",start_url:"./",display:"standalone",background_color:"#050508",theme_color:"#00ff88",icons:[{src:"https://cdn-icons-png.flaticon.com/512/2721/2721626.png",sizes:"192x192",type:"image/png"}]};
document.getElementById('manifest-link').href=URL.createObjectURL(new Blob([JSON.stringify(manifestData)],{type:'application/json'}));
const swCode=`const C="ali-v8-vosk";self.addEventListener("install",e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(["./"])))});self.addEventListener("fetch",e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)))})`;
if('serviceWorker' in navigator){navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode],{type:'text/javascript'})))}

// MOTEUR CALC
let current="",voices=[],voskModel=null,voskReady=false;
const screen=document.getElementById('screen'),historyEl=document.getElementById('history'),statusEl=document.getElementById('status'),micBtn=document.getElementById('micBtn');
function loadVoices(){voices=speechSynthesis.getVoices();} speechSynthesis.onvoiceschanged=loadVoices; loadVoices();
function add(v){if(current==="0"&&!"+-×÷^().!²³%".includes(v))current="";current+=v;screen.textContent=current;}
function clearAll(){current="";screen.textContent="0";historyEl.textContent="";speak("Effacé");}
function back(){current=current.slice(0,-1);screen.textContent=current||"0";}
function fact(n){if(n<0)return NaN;if(n===0)return 1;let r=1;for(let i=1;i<=n;i++)r*=i;return r;}
function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=0.92;let fr=voices.find(v=>v.lang.toLowerCase().includes('fr'))||voices[0];if(fr)u.voice=fr;speechSynthesis.speak(u);}catch(e){}}
function calc(){try{if(!current)return;let o=current;let open=(o.match(/\(/g)||[]).length;let close=(o.match(/\)/g)||[]).length;if(open>close)o+=")".repeat(open-close);historyEl.textContent=o;let e=o;e=e.replace(/(\d+)\s*√\s*\(([^)]+)\)/g,'Math.pow(($2),1/$1)');e=e.replace(/(\d+)\s*√\s*(\d+(\.\d+)?)/g,'Math.pow($2,1/$1)');e=e.replace(/√\(/g,'Math.sqrt(');e=e.replace(/√(\d+(\.\d+)?)/g,'Math.sqrt($1)');e=e.replace(/√/g,'Math.sqrt');e=e.replaceAll('×','*').replaceAll('÷','/').replaceAll('π','Math.PI').replaceAll('²','**2').replaceAll('³','**3').replaceAll('^','**').replaceAll('sin(','Math.sin((Math.PI/180)*').replaceAll('cos(','Math.cos((Math.PI/180)*').replaceAll('tan(','Math.tan((Math.PI/180)*').replaceAll('log(','Math.log10(').replaceAll('ln(','Math.log(').replaceAll('%','/100').replace(/\be\b/g,'Math.E').replace(/(\d+)!/g,'fact($1)');let r=eval(e);if(!isFinite(r))throw"err";current=parseFloat(r.toFixed(10)).toString();screen.textContent=current;speak(`Résultat ${current}`);}catch(err){screen.textContent="Erreur";speak("Erreur");}}

// --- MOTEUR VOSK OFFLINE ---
async function initVosk(){
  try{
    statusEl.textContent="Téléchargement voix offline 50Mo (1 fois)...";
    // Modèle français léger officiel Vosk
    const modelUrl = "https://alphacephei.com/vosk/models/vosk-model-small-fr-0.22.zip";
    voskModel = await Vosk.createModel(modelUrl);
    voskReady=true;
    statusEl.textContent="✅ Offline prêt - Micro sans internet";
    micBtn.textContent="🎤 Offline ✅";
    speak("Moteur offline prêt");
  }catch(e){
    console.log(e);
    statusEl.textContent="⚠️ Offline non chargé, micro online";
    voskReady=false;
  }
}
initVosk();

let mediaRecorder=null;
async function startMicOffline(){
  if(voskReady && voskModel){
    // MODE 100% OFFLINE VOSK
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      const rec = new voskModel.KaldiRecognizer(16000);
      const processor = voskModel.createProcessor(rec);
      micBtn.classList.add('listening'); micBtn.textContent="● Écoute OFF";
      statusEl.textContent="Parle... (offline)";
      processor.on('result', (msg)=>{
        let text = msg.text.toLowerCase();
        let m={'zéro':'0','un':'1','deux':'2','trois':'3','quatre':'4','cinq':'5','six':'6','sept':'7','huit':'8','neuf':'9','plus':'+','moins':'-','fois':'*','divisé':'/','racine':'√'};
        let s=text; for(let k in m) s=s.replaceAll(k,m[k]);
        s=s.replace(/[^0-9+\-*/().^%√²³!]/g,'');
        if(s){current=s;screen.textContent=current;setTimeout(calc,300);}
        micBtn.classList.remove('listening'); micBtn.textContent="🎤 Offline ✅";
        statusEl.textContent="✅ Offline prêt";
        stream.getTracks().forEach(t=>t.stop());
      });
      //Enregistre 3 sec offline
      setTimeout(()=>{processor.stop();},3000);
    }catch(err){statusEl.textContent="Micro refusé"; }
  } else {
    // FALLBACK ONLINE GRATUIT
    let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){speak("Micro non supporté");return;}
    let rec=new SR(); rec.lang="fr-FR";
    rec.onstart=()=>{micBtn.classList.add('listening'); micBtn.textContent="● Écoute ON";};
    rec.onend=()=>{micBtn.classList.remove('listening'); micBtn.textContent=voskReady?"🎤 Offline ✅":"🎤 Online";};
    rec.onresult=(ev)=>{
      let t=ev.results[0][0].transcript.toLowerCase();
      let m={'zéro':'0','un':'1','deux':'2','trois':'3','quatre':'4','cinq':'5','six':'6','sept':'7','huit':'8','neuf':'9','plus':'+','moins':'-','fois':'*','divisé':'/','racine':'√'};
      let s=t; for(let k in m) s=s.replaceAll(k,m[k]);
      s=s.replace(/[^0-9+\-*/().^%√²³!]/g,'');
      if(s){current=s;screen.textContent=current;setTimeout(calc,400);}
    };
    rec.start();
  }
}
document.body.addEventListener('click',()=>{loadVoices();},{once:true});
</script>
</body>
</html>
